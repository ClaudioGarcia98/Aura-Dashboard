name: CI/CD Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Install browser for production smoke checks
        run: npx playwright install --with-deps chromium

      - name: Check production app in browser
        run: npm run test:browser

      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

      - name: Verify source remains unchanged
        run: git diff --exit-code

      - name: Save validated distribution
        if: github.repository_owner == 'ClaudioGarcia98' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: test
    permissions:
      pages: write
      id-token: write
    # Deploy only on pushes to the main branch of the owner's repository
    if: github.repository_owner == 'ClaudioGarcia98' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
